<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Knowledge Assistant & MLOps Eval</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full font-sans text-slate-100 flex flex-col justify-between p-4 md:p-8">

    <div class="max-w-4xl mx-auto w-full">
        <!-- Header -->
        <header class="flex items-center justify-between pb-6 mb-6 border-b border-slate-800">
            <div>
                <h1 class="text-2xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-file-pdf text-rose-500"></i> Dynamic PDF Knowledge Assistant
                </h1>
                <p class="text-xs text-slate-400 mt-1">Single-Document RAG with Zero Cross-Contamination & Automated CI/CD Eval</p>
            </div>
            <a href="/docs" target="_blank" class="text-xs text-indigo-400 hover:text-indigo-300 font-mono bg-indigo-950/50 border border-indigo-800/50 px-3 py-1.5 rounded-lg transition">
                &lt;/&gt; Swagger API
            </a>
        </header>

        <!-- PDF Upload Control (Option 1 Architecture) -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 mb-6 shadow-xl">
            <h2 class="text-xs font-semibold text-rose-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                <i class="fa-solid fa-upload"></i> Step 1: Upload Active PDF
            </h2>
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                <input type="file" id="pdfFileInput" accept=".pdf" 
                    class="block w-full text-xs text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-rose-400 hover:file:bg-slate-700 cursor-pointer bg-slate-950 rounded-lg border border-slate-800 p-1">
                <button onclick="uploadPDF()" id="uploadBtn" 
                    class="bg-rose-600 hover:bg-rose-500 text-white text-xs font-medium px-5 py-3 rounded-lg transition flex items-center justify-center gap-2 shrink-0">
                    <i class="fa-solid fa-arrows-rotate"></i> Upload & Reset Vector DB
                </button>
            </div>
            <div id="uploadStatus" class="mt-3 text-xs font-mono hidden"></div>
        </div>

        <!-- Question Answering Interface -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-xl">
            <h2 class="text-xs font-semibold text-indigo-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                <i class="fa-solid fa-comments"></i> Step 2: Query the Active Document
            </h2>

            <form onsubmit="askQuestion(event)" class="space-y-4">
                <div>
                    <input type="text" id="queryInput" placeholder="Ask anything about the currently active PDF..." 
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
                </div>
                <div class="flex justify-end">
                    <button type="submit" id="askBtn" 
                        class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium px-6 py-2.5 rounded-lg transition flex items-center gap-2">
                        <span>Ask Assistant</span>
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </form>

            <!-- Output Container -->
            <div id="outputSection" class="mt-6 space-y-4 hidden">
                <!-- Answer Box -->
                <div id="answerCard" class="p-4 rounded-lg bg-slate-950 border border-slate-800">
                    <div class="text-xs font-semibold text-slate-400 mb-2 flex items-center justify-between">
                        <span>GENERATED RESPONSE</span>
                        <span id="activeDocBadge" class="text-[10px] bg-slate-800 text-indigo-300 px-2 py-0.5 rounded font-mono"></span>
                    </div>
                    <p id="answerText" class="text-sm text-slate-200 leading-relaxed font-sans"></p>
                </div>

                <!-- Context Chunks Accordion -->
                <div class="p-4 rounded-lg bg-slate-950/60 border border-slate-800/80">
                    <button onclick="toggleContexts()" class="w-full flex items-center justify-between text-xs font-mono text-slate-400 hover:text-slate-300">
                        <span class="flex items-center gap-1.5">
                            <i class="fa-solid fa-database text-indigo-400"></i> RETRIEVED CHROMADB CHUNKS
                        </span>
                        <i id="accordionIcon" class="fa-solid fa-chevron-down transition-transform duration-200"></i>
                    </button>
                    <div id="contextList" class="mt-3 space-y-2 hidden"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-8 text-center text-xs text-slate-500 font-mono">
        System Architecture: FastAPI • ChromaDB • Groq (Llama 3.1 8B) • PyMuPDF
    </footer>

    <!-- JavaScript Logic -->
    <script>
        async function uploadPDF() {
            const fileInput = document.getElementById('pdfFileInput');
            const statusDiv = document.getElementById('uploadStatus');
            const uploadBtn = document.getElementById('uploadBtn');

            if (!fileInput.files.length) {
                alert("Please select a PDF file first.");
                return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            uploadBtn.disabled = true;
            statusDiv.classList.remove('hidden');
            statusDiv.className = "mt-3 text-xs font-mono text-indigo-400 animate-pulse";
            statusDiv.innerText = "⏳ Wiping previous ChromaDB collection & indexing new PDF...";

            try {
                const res = await fetch('/upload-pdf', { method: 'POST', body: formData });
                const data = await res.json();
                
                if (res.ok) {
                    statusDiv.className = "mt-3 text-xs font-mono text-emerald-400 p-2 bg-emerald-950/30 border border-emerald-800/50 rounded-lg";
                    statusDiv.innerHTML = `✓ Knowledge Base Reset! Active Document: <strong>${data.filename}</strong> (${data.chunks_indexed} chunks indexed)`;
                } else {
                    statusDiv.className = "mt-3 text-xs font-mono text-rose-400 p-2 bg-rose-950/30 border border-rose-800/50 rounded-lg";
                    statusDiv.innerText = `Error: ${data.detail}`;
                }
            } catch (err) {
                statusDiv.className = "mt-3 text-xs font-mono text-rose-400 p-2 bg-rose-950/30 border border-rose-800/50 rounded-lg";
                statusDiv.innerText = `Upload failed: ${err}`;
            } finally {
                uploadBtn.disabled = false;
            }
        }

        async function askQuestion(e) {
            e.preventDefault();
            const queryInput = document.getElementById('queryInput');
            const askBtn = document.getElementById('askBtn');
            const outputSection = document.getElementById('outputSection');
            const answerCard = document.getElementById('answerCard');
            const answerText = document.getElementById('answerText');
            const activeDocBadge = document.getElementById('activeDocBadge');
            const contextList = document.getElementById('contextList');

            const query = queryInput.value.trim();
            if (!query) return;

            askBtn.disabled = true;
            askBtn.innerText = "Searching & Generating...";

            try {
                const res = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query, top_k: 3 })
                });

                const data = await res.json();
                outputSection.classList.remove('hidden');

                if (res.ok) {
                    answerText.innerText = data.answer;
                    activeDocBadge.innerText = data.active_document ? `Doc: ${data.active_document}` : 'No Doc Loaded';

                    // Style amber if refusing
                    if (data.answer.includes("cannot answer")) {
                        answerCard.className = "p-4 rounded-lg bg-amber-950/30 border border-amber-800/50";
                    } else {
                        answerCard.className = "p-4 rounded-lg bg-slate-950 border border-slate-800";
                    }

                    // Populate contexts
                    contextList.innerHTML = '';
                    if (data.retrieved_contexts.length > 0) {
                        data.retrieved_contexts.forEach((ctx, idx) => {
                            const div = document.createElement('div');
                            div.className = "p-2.5 bg-slate-900 border border-slate-800 rounded text-xs font-mono text-slate-300";
                            div.innerText = `Chunk ${idx + 1}: ${ctx}`;
                            contextList.appendChild(div);
                        });
                    } else {
                        contextList.innerHTML = '<p class="text-xs text-slate-500 italic">No contexts retrieved.</p>';
                    }
                } else {
                    answerText.innerText = `Error: ${data.detail}`;
                }
            } catch (err) {
                answerText.innerText = `An error occurred: ${err}`;
            } finally {
                askBtn.disabled = false;
                askBtn.innerHTML = '<span>Ask Assistant</span> <i class="fa-solid fa-paper-plane"></i>';
            }
        }

        function toggleContexts() {
            const contextList = document.getElementById('contextList');
            const icon = document.getElementById('accordionIcon');
            contextList.classList.toggle('hidden');
            icon.classList.toggle('rotate-180');
        }
    </script>
</body>
</html>
